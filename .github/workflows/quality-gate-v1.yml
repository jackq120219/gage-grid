name: Gage Grid Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Data contracts
        run: node scripts/data-audit.mjs
      - name: Live source wiring
        run: node scripts/live-source-audit.mjs
      - name: SEO contract
        run: node scripts/seo-audit.mjs
